# Added to herdr's Claude manifest by install/common/herdr_manifest.py: a footer
# counting running background shells means the session is still working.
[[rules]]
id = "dotfiles_background_shells_working"
state = "working"
priority = 960
region = "after_last_horizontal_rule"
visible_working = true
line_regex = ['(?:^|\s·)\s+[1-9]\d*\s+shells?(?:\s+·|\s*$)']
not = [
  { contains = ["do you want to proceed?"] },
  { contains = ["esc to cancel"] },
  { contains = ["waiting for permission"] },
  { contains = ["do you want to allow this connection?"] },
  { contains = ["tab to amend"] },
  { contains = ["ctrl+e to explain"] },
]
