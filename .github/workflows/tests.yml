name: tests

# Every dotfiles test is a standalone shell script; bin/dotfiles-tests is the
# single runner. Without CI these drift guards only fire when a human
# remembers to run them -- this workflow makes drift visible on every push.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # zsh: syntax-gate the shell layer (not installed on the runner image).
      # ripgrep: commit-msg hook dependency; without it the hook (and its
      # test's rg-missing notice path) can't exercise the real code path.
      - name: Install zsh and ripgrep
        run: sudo apt-get update && sudo apt-get install -y zsh ripgrep

      - name: zsh syntax check
        run: |
          for f in zsh/.zshenv zsh/.zshrc zsh/.zprofile zsh/aliases.zsh zsh/claude-account.zsh zsh/codex-account.zsh zsh/functions.zsh zsh/theme.zsh zsh/scripts/*.zsh; do
            zsh -n "$f" && echo "[OK] $f"
          done

      - name: bash syntax check
        run: |
          for f in bootstrap.sh bootstrap-cloud.sh install/install.sh install/common/*.sh \
                   install/linux/*.sh install/macos/*.sh bin/dotfiles-repair bin/dotfiles-tests \
                   bin/identity-doctor bin/identity-setup bin/setup-claude \
                   .claude/hooks/session-start.sh git/hooks/*; do
            case "$f" in *.test.sh) continue ;; esac
            bash -n "$f" && echo "[OK] $f"
          done

      - name: python syntax check
        run: |
          python3 -m py_compile claude/hooks/*.py codex/hooks/*.py
          python3 -m py_compile install/common/codex-surfaces.py install/common/codex-roles.py
          python3 -m py_compile claude/skills/lib/*.py claude/skills/co-review/scripts/*.py claude/skills/handoff/scripts/*.py
          echo "[OK] hook scripts compile"

      # py_compile above cannot catch a PEP 604 annotation used without
      # `from __future__ import annotations`: the annotation is a runtime
      # expression, so it compiles on every interpreter and only raises
      # TypeError at IMPORT on Python 3.9. That is the stock macOS python and
      # what `#!/usr/bin/env python3` resolves to before Homebrew python
      # exists, and a hook that dies at import exits 1 -- neither the allow (0)
      # nor the deny (2) a hook may return -- so the guard fails OPEN. This
      # step imports each module on the floor interpreter, one subprocess
      # apiece so a single break cannot mask another.
      - name: install the minimum supported python
        uses: actions/setup-python@v5
        with:
          python-version: "3.9"
      - name: import every hook under python 3.9
        run: |
          python3 - <<'PY'
          import glob, os, subprocess, sys
          mods = sorted(os.path.basename(p)[:-3]
                        for p in glob.glob("claude/hooks/*.py") + glob.glob("claude/skills/lib/*.py"))
          mods = [m for m in mods if not (m.endswith("_test") or m.startswith("test_"))]
          code = ('import sys; sys.path.insert(0, "claude/hooks");'
                  ' sys.path.insert(0, "claude/skills/lib"); import %s')
          bad = []
          for m in mods:
              r = subprocess.run([sys.executable, "-c", code % m], capture_output=True, text=True)
              if r.returncode != 0:
                  bad.append((m, r.stderr.strip().splitlines()[-1]))
          print("interpreter %s, probed %d modules" % (sys.version.split()[0], len(mods)))
          for m, err in bad:
              print("[X] %s: %s" % (m, err))
          if bad:
              raise SystemExit("%d hook module(s) do not import on the floor interpreter" % len(bad))
          print("[OK] every hook imports")
          PY

      - name: Run all test suites
        run: bash bin/dotfiles-tests
